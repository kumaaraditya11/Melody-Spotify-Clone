<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Melody 2.0 - a Spotify-inspired music player built with HTML, CSS and vanilla JavaScript.">
  <title>Melody 2.0</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231fdf64'/%3E%3Crect x='7' y='14' width='4' height='10' rx='2' fill='%230a0a0a'/%3E%3Crect x='14' y='8' width='4' height='16' rx='2' fill='%230a0a0a'/%3E%3Crect x='21' y='12' width='4' height='12' rx='2' fill='%230a0a0a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- ================= LEFT SIDEBAR ================= -->
    <aside class="sidebar" aria-label="Main navigation">
      <button class="brand" data-action="nav" data-view="home" aria-label="Melody 2.0 home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1fdf64"/>
          <rect x="7" y="14" width="4" height="10" rx="2" fill="#0a0a0a"/>
          <rect x="14" y="8" width="4" height="16" rx="2" fill="#0a0a0a"/>
          <rect x="21" y="12" width="4" height="12" rx="2" fill="#0a0a0a"/>
        </svg>
        <span class="brand-text">Melody <span class="brand-version">2.0</span></span>
      </button>

      <nav>
        <ul class="nav-list">
          <li><button class="nav-item" data-action="nav" data-view="home" title="Home"><i data-icon="home"></i><span class="nav-label">Home</span></button></li>
          <li><button class="nav-item" data-action="nav" data-view="search" title="Search"><i data-icon="search"></i><span class="nav-label">Search</span></button></li>
          <li><button class="nav-item" data-action="nav" data-view="library" title="Your Library"><i data-icon="library"></i><span class="nav-label">Your Library</span></button></li>
          <li><button class="nav-item" data-action="nav" data-view="liked" title="Liked Songs"><i data-icon="heart"></i><span class="nav-label">Liked Songs</span></button></li>
          <li><button class="nav-item" data-action="nav" data-view="recent" title="Recently Played"><i data-icon="clock"></i><span class="nav-label">Recently Played</span></button></li>
        </ul>
      </nav>

      <section class="side-playlists" aria-label="Your playlists">
        <h2 class="side-heading">Playlists</h2>
        <div id="sidebar-playlists" class="side-playlist-list"></div>
      </section>

      <button class="btn btn-primary create-btn" data-action="create-playlist" title="Create Playlist">
        <i data-icon="plus"></i><span class="nav-label">Create Playlist</span>
      </button>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="topbar-logo" data-action="nav" data-view="home" aria-label="Melody 2.0 home">Melody <span>2.0</span></button>
        <form class="search-box" id="search-form" role="search">
          <i data-icon="search"></i>
          <input id="search-input" type="search" placeholder="Search by song, artist or album" autocomplete="off" aria-label="Search songs, artists or albums">
        </form>
        <button class="btn btn-outline" data-action="add-music" title="Add music from your device">
          <i data-icon="upload"></i><span class="btn-label">Add Music</span>
        </button>
      </header>

      <!-- Each page (Home, Search, Library...) is drawn into this element by script.js -->
      <div id="view" class="view"></div>
    </main>

    <!-- ================= BOTTOM PLAYER ================= -->
    <footer class="player" aria-label="Music player">
      <div class="player-song">
        <img id="player-cover" class="player-cover" alt="">
        <div class="player-meta">
          <p id="player-title" class="player-title">Nothing playing</p>
          <p id="player-artist" class="player-artist">Pick a song to start</p>
        </div>
        <button id="player-like" class="icon-btn like-btn" aria-label="Add to Liked Songs" title="Add to Liked Songs"></button>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button id="shuffle-btn" class="icon-btn" aria-label="Shuffle" aria-pressed="false" title="Shuffle: off"></button>
          <button id="prev-btn" class="icon-btn" aria-label="Previous song" title="Previous (Left Arrow)"></button>
          <button id="play-btn" class="play-btn" aria-label="Play" title="Play / Pause (Space)"></button>
          <button id="next-btn" class="icon-btn" aria-label="Next song" title="Next (Right Arrow)"></button>
          <button id="repeat-btn" class="icon-btn" aria-label="Repeat" aria-pressed="false" title="Repeat: off"></button>
        </div>
        <div class="player-progress">
          <span id="current-time" class="time">0:00</span>
          <input id="progress-range" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <span id="total-time" class="time">0:00</span>
        </div>
      </div>

      <div class="player-extra">
        <button id="player-playlist" class="icon-btn" data-action="add-to-playlist" aria-label="Add current song to a playlist" title="Add to playlist"></button>
        <button id="mute-btn" class="icon-btn" aria-label="Mute" title="Mute"></button>
        <input id="volume-range" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </footer>

  </div>

  <!-- Hidden file picker used by every "Add Music" button -->
  <input id="file-input" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac" multiple hidden>

  <!-- Small dropdown for "Add to playlist" -->
  <div id="playlist-menu" class="popover" role="menu" hidden></div>

  <!-- Reusable popup for names and confirmations -->
  <div id="modal" class="modal-backdrop" hidden>
    <form id="modal-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Title</h2>
      <p id="modal-message" class="modal-message"></p>
      <input id="modal-input" class="modal-input" type="text" maxlength="40" autocomplete="off">
      <p id="modal-error" class="form-error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" id="modal-confirm" class="btn btn-primary">OK</button>
      </div>
    </form>
  </div>

  <!-- Toast notifications appear here -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <noscript>Melody 2.0 needs JavaScript to work. Please enable it in your browser.</noscript>

  <script src="script.js"></script>
</body>
</html>
